<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vishnu — Under Maintenance</title>
  <link rel="shortcut icon" href="./assets/image/personal_logo.jpeg" type="image/x-icon">

  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #f5f6f7;
      --muted: #9aa1ab;
      --accent: #5b8cff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      margin: 0 0 12px;
    }

    p {
      color: var(--muted);
      line-height: 1.5;
      margin: 0 0 8px;
      font-size: 1rem;
    }

    .accent {
      color: var(--accent);
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="icon">🛠️</div>
    <h1>Site under maintenance</h1>
    <p>We're making some updates and will be back shortly.</p>
    <p>Thanks for your patience — <span class="accent">Vishnu</span></p>
  </div>
</body>

</html>
